[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "t21-engine"
version = "0.2.0"
description = "Deterministic biomedical signal pipeline for the T21 Safe research prototype"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<2.5",
  "scipy>=1.12,<2",
]

[project.scripts]
t21-research-node-demo = "t21_engine.demo:main"
t21-research-node-mcp = "t21_engine.research_node_mcp.server:main"
t21-fantasia-mcp = "t21_engine.fantasia_mcp.server:main"

[project.optional-dependencies]
wfdb = ["wfdb>=4.1,<5"]
training = ["joblib>=1.4,<2", "scikit-learn>=1.5,<2"]
dev = [
  "joblib>=1.4,<2",
  "jsonschema>=4.23,<5",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
  "scikit-learn>=1.5,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/t21_engine"]

[tool.pytest.ini_options]
testpaths = ["../../tests/backend"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["t21_engine"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "joblib", "sklearn", "sklearn.*", "wfdb"]
ignore_missing_imports = true
