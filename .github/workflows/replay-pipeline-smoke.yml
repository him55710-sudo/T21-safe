# CODEX-070: CI smoke for synthetic replay pipeline integration.
# Synthetic/local observe-only · clinical_validation=false · no VitalDB.
name: Replay pipeline smoke

on:
  push:
    branches: [main]
    paths:
      - "services/engine/src/t21_engine/streaming/**"
      - "services/engine/src/t21_engine/adapters/synthetic_adapter.py"
      - "services/engine/src/t21_engine/config.py"
      - "services/engine/src/t21_engine/types.py"
      - "tests/backend/integration/test_replay_pipeline.py"
      - ".github/workflows/replay-pipeline-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/engine/src/t21_engine/streaming/**"
      - "services/engine/src/t21_engine/adapters/synthetic_adapter.py"
      - "services/engine/src/t21_engine/config.py"
      - "services/engine/src/t21_engine/types.py"
      - "tests/backend/integration/test_replay_pipeline.py"
      - ".github/workflows/replay-pipeline-smoke.yml"

jobs:
  replay-pipeline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine (dev)
        run: python -m pip install -e "services/engine[dev]"
      - name: Pytest replay pipeline integration
        env:
          PYTHONPATH: services/engine/src
        run: |
          set -euo pipefail
          python -m pytest \
            tests/backend/integration/test_replay_pipeline.py \
            -q --tb=short
