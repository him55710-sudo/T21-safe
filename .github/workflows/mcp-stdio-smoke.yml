name: MCP stdio smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dual-mcp-stdio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine (dev + wfdb)
        run: python -m pip install -e "services/engine[dev,wfdb]"
      - name: Pytest MCP stdio matrix (includes BIDMC/MIT-BIH PROXY tools)
        env:
          PYTHONPATH: services/engine/src
        run: |
          python -m pytest \
            tests/backend/unit/test_mcp_stdio_smoke.py \
            tests/backend/unit/test_research_node_mcp_stdio.py \
            tests/backend/unit/test_smoke_dual_mcp_script.py \
            -q --tb=short
      - name: Dual MCP script smoke
        env:
          PYTHONPATH: services/engine/src
        run: python scripts/smoke_dual_mcp.py
