# CODEX-047: fail if docs/mcp/TOOL_CATALOG.md drifts from generate_mcp_tool_catalog.py
name: MCP tool catalog drift

on:
  push:
    branches: [main]
    paths:
      - "docs/mcp/TOOL_CATALOG.md"
      - "scripts/generate_mcp_tool_catalog.py"
      - "services/engine/src/t21_engine/fantasia_mcp/**"
      - "services/engine/src/t21_engine/research_node_mcp/**"
      - ".github/workflows/mcp-tool-catalog-drift.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/mcp/TOOL_CATALOG.md"
      - "scripts/generate_mcp_tool_catalog.py"
      - "services/engine/src/t21_engine/fantasia_mcp/**"
      - "services/engine/src/t21_engine/research_node_mcp/**"
      - ".github/workflows/mcp-tool-catalog-drift.yml"

jobs:
  catalog-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine (dev)
        run: python -m pip install -e "services/engine[dev]"
      - name: Regenerate TOOL_CATALOG and diff
        env:
          PYTHONPATH: services/engine/src
        run: |
          set -euo pipefail
          python scripts/generate_mcp_tool_catalog.py
          git diff --exit-code -- docs/mcp/TOOL_CATALOG.md