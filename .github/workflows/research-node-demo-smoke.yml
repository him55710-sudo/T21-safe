# CODEX-071: CI smoke for Research Node demo + synthetic hospital integration.
# Synthetic-only · clinical_validation=false · no VitalDB / CapnoBase / PulseDB.
name: Research node demo smoke

on:
  push:
    branches: [main]
    paths:
      - "services/engine/src/t21_engine/demo.py"
      - "services/engine/src/t21_engine/adapters/synthetic_hospital_case.py"
      - "services/engine/src/t21_engine/streaming/**"
      - "tests/backend/integration/test_research_node_demo.py"
      - "tests/backend/integration/test_synthetic_hospital_smoke.py"
      - ".github/workflows/research-node-demo-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/engine/src/t21_engine/demo.py"
      - "services/engine/src/t21_engine/adapters/synthetic_hospital_case.py"
      - "services/engine/src/t21_engine/streaming/**"
      - "tests/backend/integration/test_research_node_demo.py"
      - "tests/backend/integration/test_synthetic_hospital_smoke.py"
      - ".github/workflows/research-node-demo-smoke.yml"

jobs:
  research-node-demo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine (dev)
        run: python -m pip install -e "services/engine[dev]"
      - name: Pytest research node demo + hospital smoke
        env:
          PYTHONPATH: services/engine/src
        run: |
          set -euo pipefail
          python -m pytest \
            tests/backend/integration/test_research_node_demo.py \
            tests/backend/integration/test_synthetic_hospital_smoke.py \
            -q --tb=short
