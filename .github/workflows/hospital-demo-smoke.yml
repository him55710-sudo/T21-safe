# CODEX-082/086/092/098: hospital demo runner + showcards + pack zip fail-closed contents.
# Synthetic-only · clinical_validation=false · PHI-false · no VitalDB.
name: Hospital demo smoke

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_hospital_demo.sh"
      - "scripts/run_hospital_demo_chain.sh"
      - "scripts/generate_hospital_demo_showcard.py"
      - "scripts/generate_hospital_demo_showcard_html.py"
      - "scripts/pack_hospital_demo_partner.sh"
      - "tests/backend/unit/test_run_hospital_demo.py"
      - "tests/backend/unit/test_run_hospital_demo_chain.py"
      - "tests/backend/unit/test_generate_hospital_demo_showcard.py"
      - "tests/backend/unit/test_generate_hospital_demo_showcard_html.py"
      - "tests/backend/unit/test_pack_hospital_demo_partner.py"
      - "tests/backend/unit/test_partner_pack_zip_contents.py"
      - "docs/business/export-manifest-phi-false-1p.md"
      - "docs/business/research-node-one-pager.md"
      - "docs/business/research-overview-2p.md"
      - "docs/business/safety-local-first-1p.md"
      - "Makefile"
      - "services/engine/src/t21_engine/demo.py"
      - "services/engine/src/t21_engine/adapters/synthetic_hospital_case.py"
      - "services/engine/src/t21_engine/streaming/**"
      - ".github/workflows/hospital-demo-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_hospital_demo.sh"
      - "scripts/run_hospital_demo_chain.sh"
      - "scripts/generate_hospital_demo_showcard.py"
      - "scripts/generate_hospital_demo_showcard_html.py"
      - "scripts/pack_hospital_demo_partner.sh"
      - "tests/backend/unit/test_run_hospital_demo.py"
      - "tests/backend/unit/test_run_hospital_demo_chain.py"
      - "tests/backend/unit/test_generate_hospital_demo_showcard.py"
      - "tests/backend/unit/test_generate_hospital_demo_showcard_html.py"
      - "tests/backend/unit/test_pack_hospital_demo_partner.py"
      - "tests/backend/unit/test_partner_pack_zip_contents.py"
      - "docs/business/export-manifest-phi-false-1p.md"
      - "docs/business/research-node-one-pager.md"
      - "docs/business/research-overview-2p.md"
      - "docs/business/safety-local-first-1p.md"
      - "Makefile"
      - "services/engine/src/t21_engine/demo.py"
      - "services/engine/src/t21_engine/adapters/synthetic_hospital_case.py"
      - "services/engine/src/t21_engine/streaming/**"
      - ".github/workflows/hospital-demo-smoke.yml"

jobs:
  hospital-demo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine (dev)
        run: python -m pip install -e "services/engine[dev]"
      - name: Bash syntax + hospital demo suite units
        env:
          PYTHONPATH: services/engine/src
        run: |
          set -euo pipefail
          bash -n scripts/run_hospital_demo.sh
          bash -n scripts/run_hospital_demo_chain.sh
          bash -n scripts/pack_hospital_demo_partner.sh
          python -m pytest \
            tests/backend/unit/test_run_hospital_demo.py \
            tests/backend/unit/test_run_hospital_demo_chain.py \
            tests/backend/unit/test_generate_hospital_demo_showcard.py \
            tests/backend/unit/test_generate_hospital_demo_showcard_html.py \
            tests/backend/unit/test_pack_hospital_demo_partner.py \
            tests/backend/unit/test_partner_pack_zip_contents.py \
            -q --tb=short
      - name: Full hospital demo runner (tmp)
        env:
          PYTHONPATH: services/engine/src
        run: |
          set -euo pipefail
          bash scripts/run_hospital_demo.sh "${RUNNER_TEMP}/t21-hospital-demo"
      - name: MD + HTML show-card + partner pack smoke
        env:
          PYTHONPATH: services/engine/src
        run: |
          set -euo pipefail
          python3 scripts/generate_hospital_demo_showcard.py \
            "${RUNNER_TEMP}/t21-hospital-demo/hospital-demo-report.json" \
            -o "${RUNNER_TEMP}/t21-hospital-demo/showcard.md"
          python3 scripts/generate_hospital_demo_showcard_html.py \
            "${RUNNER_TEMP}/t21-hospital-demo/hospital-demo-report.json" \
            -o "${RUNNER_TEMP}/t21-hospital-demo/showcard.html"
          bash scripts/pack_hospital_demo_partner.sh \
            "${RUNNER_TEMP}/t21-hospital-demo" \
            "${RUNNER_TEMP}/t21-hospital-demo-partner-pack"
          python -c 'import os,zipfile; from pathlib import Path; z=Path(os.environ["RUNNER_TEMP"])/"t21-hospital-demo-partner-pack"/"t21-hospital-demo-partner-pack.zip"; n=set(zipfile.ZipFile(z).namelist()); r={"reports/showcard.html","reports/showcard.md","docs/export-manifest-phi-false-1p.md","docs/research-node-one-pager.md","docs/research-overview-2p.md","docs/safety-local-first-1p.md"}; m=sorted(r-n); assert not m, m; print("partner zip fail-closed contents OK")'
